services:
  - type: web
    name: whats-being-built-api
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: SEARCH_API_KEY
        sync: false
      - key: SEARCH_PROVIDER
        value: tavily
      - key: LLM_PROVIDER
        value: gemini
      - key: GEMINI_API_KEY
        sync: false
      - key: LLM_API_KEY
        sync: false
